name: 'Adversarial Code Review'
description: 'Multi-model adversarial code review — Optimizer and Skeptic agents challenge each other, auto-fix consensus issues.'
author: 'ng'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token (from Anthropic Console)'
    required: true
  pr_number:
    description: 'Pull request number to review. Defaults to the triggering PR.'
    required: false
    default: '${{ github.event.pull_request.number }}'
  mode:
    description: 'Review mode: "no-fix" (default) reports only, "auto-fix" applies consensus fixes. Any unrecognized value falls back to "no-fix" (fail-safe).'
    required: false
    default: 'no-fix'
  allowed_tools:
    description: 'Additional allowed tools (comma-separated). git, gh, and common build tools are included by default.'
    required: false
    default: ''
  model:
    description: 'Model to use for the lead agent (e.g. "opus", "sonnet"). Defaults to the claude-code-action default.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run Adversarial Review
      uses: anthropics/claude-code-action@1eddb334cfa79fdb21ecbe2180ca1a016e8e7d47 # v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        plugin_marketplaces: 'https://github.com/ng/adversarial-review.git'
        plugins: 'adversarial-review@adversarial-review'
        # Fail safe: only an explicit "auto-fix" enables code modification; any other
        # value (typos, "review-only", ...) runs with --no-fix. The condition must be
        # the != form: in `a && '' || b` the empty string is falsy, so the || branch
        # would fire even when a is true.
        prompt: '/adversarial-review:run ${{ inputs.mode != ''auto-fix'' && ''--no-fix'' || '''' }} ${{ inputs.pr_number }}'
        # claude-code-action v1 removed the allowed_tools/model inputs — both are passed
        # through claude_args instead.
        claude_args: >-
          --allowedTools "Bash(git *),Bash(gh *),Bash(curl *),Bash(jq *),Bash(pnpm *),Bash(npm *),Bash(npx *),Bash(yarn *),Bash(cargo *),Bash(go *),Bash(python *),Bash(pip *),Bash(make *)${{ inputs.allowed_tools != '' && format(',{0}', inputs.allowed_tools) || '' }}"
          ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
