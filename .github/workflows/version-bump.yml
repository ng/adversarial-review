name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-plugin-version:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update plugin manifest versions
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          python3 -c "
          import json
          for f in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json']:
              data = json.load(open(f))
              if 'version' in data:
                  data['version'] = '$VERSION'
              if 'plugins' in data:
                  for p in data['plugins']:
                      if 'version' in p:
                          p['version'] = '$VERSION'
              json.dump(data, open(f, 'w'), indent=2)
              with open(f, 'a') as fh:
                  fh.write('\n')
          "

      - name: Commit plugin version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync plugin manifests to v${{ needs.release-please.outputs.version }}"
          git push

      - name: Move major version tag
        run: |
          MAJOR=${{ needs.release-please.outputs.major }}
          git tag -fa "v$MAJOR" -m "v$MAJOR: latest $MAJOR.x release"
          git push origin "v$MAJOR" --force
